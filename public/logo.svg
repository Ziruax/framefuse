<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="film" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- Film strip icon -->
  <g fill="url(#film)">
    <!-- Film body -->
    <rect x="56" y="72" width="144" height="112" rx="8" fill="none" stroke="url(#film)" stroke-width="6"/>
    <!-- Top sprocket holes -->
    <rect x="68" y="82" width="12" height="8" rx="2"/>
    <rect x="92" y="82" width="12" height="8" rx="2"/>
    <rect x="116" y="82" width="12" height="8" rx="2"/>
    <rect x="140" y="82" width="12" height="8" rx="2"/>
    <rect x="164" y="82" width="12" height="8" rx="2"/>
    <!-- Bottom sprocket holes -->
    <rect x="68" y="166" width="12" height="8" rx="2"/>
    <rect x="92" y="166" width="12" height="8" rx="2"/>
    <rect x="116" y="166" width="12" height="8" rx="2"/>
    <rect x="140" y="166" width="12" height="8" rx="2"/>
    <rect x="164" y="166" width="12" height="8" rx="2"/>
    <!-- Center play triangle -->
    <polygon points="112,104 112,152 152,128" fill="url(#film)"/>
  </g>
  <!-- Spark/merge accent -->
  <circle cx="200" cy="56" r="12" fill="#06b6d4" opacity="0.9"/>
  <circle cx="200" cy="56" r="6" fill="#ffffff" opacity="0.7"/>
</svg>
